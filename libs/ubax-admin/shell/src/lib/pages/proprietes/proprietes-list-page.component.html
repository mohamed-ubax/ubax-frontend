<div class="props-page">
  <!-- Barre de filtres -->
  <div class="props-filters">
    <div class="props-filters__search">
      <input
        type="text"
        class="props-filters__search-input"
        placeholder="Rechercher par titre, ville, agence..."
        [value]="searchQuery()"
        (input)="onSearchChange($any($event.target).value)"
      />
      <i class="pi pi-search props-filters__search-icon"></i>
    </div>
    <ubax-ui-form-select
      class="props-filters__select-field"
      [options]="typeOptions"
      [value]="typeFilterLabel()"
      (valueChange)="onTypeFilterChange($event)"
    />
  </div>

  <!-- Grille de cartes -->
  @if (loading()) {
    <div class="props-grid">
      @for (i of [1, 2, 3, 4, 5, 6, 7, 8]; track i) {
        <div class="props-card-skeleton"></div>
      }
    </div>
  } @else if (filteredProperties().length === 0) {
    <ubax-empty-state
      icon="pi pi-check-circle"
      title="File d'attente vide"
      [description]="
        searchQuery()
          ? 'Aucun bien ne correspond à votre recherche.'
          : 'Aucun bien en attente de modération.'
      "
    />
  } @else {
    <div class="props-grid">
      @for (property of filteredProperties(); track property.id) {
        <button type="button" class="props-card" (click)="viewDetail(property)">
          <!-- Photo + gradient -->
          <div class="props-card__photo-wrap">
            @if (getCoverPhotoUrl(property)) {
              <img
                [src]="getCoverPhotoUrl(property)"
                [alt]="property.title"
                class="props-card__photo"
                loading="lazy"
              />
            } @else {
              <div class="props-card__photo-placeholder">
                <i class="pi pi-home"></i>
              </div>
            }
            <div class="props-card__gradient"></div>

            <!-- Badge transaction type -->
            <span
              class="props-card__transaction-badge"
              [style.background]="getTransactionColor(property.transactionType)"
            >
              {{ getTransactionTypeLabel(property.transactionType) }}
            </span>

            <!-- Badge statut -->
            <span
              class="props-card__status-badge"
              [style.background]="getStatusColor(property.status)"
            >
              {{ getStatusLabel(property.status) }}
            </span>

            <!-- Nom agence/propriétaire + prix -->
            <div class="props-card__bottom-overlay">
              @if (
                property.agencyName || property.ownerName
              ) {
                <div class="props-card__owner-row">
                  <div class="props-card__owner-avatar">
                    <i class="pi pi-building"></i>
                  </div>
                  <span class="props-card__owner-name">
                    {{ property.agencyName ?? property.ownerName }}
                  </span>
                </div>
              }
              <span class="props-card__price">
                {{ formatPrice(property.price, property.transactionType) }}
              </span>
            </div>
          </div>

          <!-- Infos bas de carte -->
          <div class="props-card__info">
            <p class="props-card__title">{{ property.title ?? '—' }}</p>
            <p class="props-card__location">
              {{ property.city ?? '' }}
              @if (property.district) {
                , {{ property.district }}
              }
            </p>

            <!-- Caractéristiques -->
            <div class="props-card__features">
              @if (property.bedrooms) {
                <span class="props-card__feature">
                  <i class="pi pi-objects-column"></i>
                  {{ property.bedrooms }} Chambres
                </span>
              }
              @if (property.bathrooms) {
                <span class="props-card__feature">
                  <i class="pi pi-drop"></i>
                  {{ property.bathrooms }} Salle de bains
                </span>
              }
              @if (property.surfaceLiving) {
                <span class="props-card__feature">
                  <i class="pi pi-expand"></i>
                  Surface {{ property.surfaceLiving }} m²
                </span>
              }
            </div>
          </div>
        </button>
      }
    </div>
  }

  <!-- Footer : compteur + pagination -->
  @if (!loading() && totalElements() > 0) {
    <div class="props-footer">
      <p class="props-footer__count">{{ getDisplayCount() }}</p>
      <ubax-paginator
        [currentPage]="currentPage()"
        [totalPages]="totalPages()"
        (currentPageChange)="onPageChange($event)"
      />
    </div>
  }
</div>
