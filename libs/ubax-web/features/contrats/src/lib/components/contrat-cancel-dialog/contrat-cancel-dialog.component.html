<div class="dlg-overlay" (click)="dismissed.emit()">
  <dialog class="dlg" (click)="$event.stopPropagation()" aria-labelledby="dlg-cancel-title" open>

    <div class="dlg__icon dlg__icon--danger" aria-hidden="true">
      <i class="pi pi-trash"></i>
    </div>

    <h2 class="dlg__title" id="dlg-cancel-title">Annuler ce contrat&nbsp;?</h2>

    <p class="dlg__message">
      Le contrat sera <strong>définitivement annulé</strong>.<br>
      Cette action est irréversible.
    </p>

    <div class="dlg__divider" aria-hidden="true"></div>

    <div class="dlg__actions">
      <button class="dlg-btn dlg-btn--ghost" type="button" (click)="dismissed.emit()" [disabled]="loading()">
        <i class="pi pi-arrow-left" aria-hidden="true"></i> Retour
      </button>
      <button class="dlg-btn dlg-btn--danger" type="button" (click)="confirm.emit()" [disabled]="loading()">
        @if (loading()) {
          <i class="pi pi-spin pi-spinner" aria-hidden="true"></i> Annulation…
        } @else {
          <i class="pi pi-check" aria-hidden="true"></i> Confirmer l'annulation
        }
      </button>
    </div>

  </dialog>
</div>
